[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hireandtech-backend"
version = "0.1.0"
description = "Backend API for the HireAndTech job intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "curl-cffi>=0.16.3",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1",
    "playwright>=1.63.0",
    "pydantic-settings>=2.10,<3.0",
    "pyjwt[crypto]>=2.10,<3",
    "pypdf>=6.18,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<3.0",
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = ["database: requires a disposable PostgreSQL database (HIREANDTECH_TEST_DATABASE_URL)"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['\.venv']

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
